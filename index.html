<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access Job Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: dark forest sidebar + cream workspace, same palette as the Access Job deck. Single light theme by choice. */
:root{
  --ink:#0c1109;
  --moss:#4e5f43;
  --cream:#d6d3ce;
  --paper:#f4f2ee;
  --card:#ffffff;
  --line:#d9d5cd;
  --muted:#5c6355;
  --ok:#2f7a4b; --ok-bg:#e3f0e6;
  --warn:#9a6411; --warn-bg:#f6ecd9;
  --bad:#a93636; --bad-bg:#f6e1e1;
  --info:#355f80; --info-bg:#e1ebf3;
  --display:"Gilda Display", Georgia, "Times New Roman", serif;
  --body:"Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius:12px;
  color-scheme:light;
}
:root[data-contrast="high"]{
  --ink:#000; --moss:#1d2a14; --cream:#ffffff; --paper:#ffffff; --card:#ffffff;
  --line:#000; --muted:#1a1a1a;
  --ok:#0b5a2a; --warn:#6b4300; --bad:#7d0000; --info:#0b3a5e;
}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
:root[data-reduce-motion="true"] *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #c9a227;outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1.15}
h2{font-family:var(--display);font-weight:400;font-size:1.45rem;line-height:1.2}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.84rem}
i[data-lucide]{display:inline-flex;width:18px;height:18px}
svg.lucide{width:18px;height:18px;stroke-width:2}

/* Shell */
.app{display:grid;grid-template-columns:248px 1fr;height:100%}
.side{background:linear-gradient(180deg,#0c1109 0%,#26311f 60%,#4e5f43 100%);color:#e9e6df;display:flex;flex-direction:column;padding:22px 14px;gap:18px;overflow-y:auto}
:root[data-contrast="high"] .side{background:#000;color:#fff}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.leaf{width:26px;height:26px;background:var(--cream);border-radius:0 60% 0 60%}
.brand b{font-family:var(--display);font-weight:400;font-size:1.35rem;letter-spacing:.01em}
.who{background:rgba(255,255,255,.08);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.who .av{background:var(--cream);color:var(--ink)}
.who small{display:block;opacity:.75;font-size:.75rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;font-size:.92rem;color:#dcd8cf}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button[aria-current="page"]{background:var(--cream);color:var(--ink);font-weight:600}
.nav button:focus-visible{outline:3px solid #c9a227}
.nav .count{margin-left:auto;background:#c9a227;color:#0c1109;font-size:.7rem;font-weight:700;border-radius:99px;padding:1px 7px}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.side .foot label{font-size:.75rem;opacity:.8;padding:0 4px}
.side select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:8px}
.side select option{color:#000}

.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--paper)}
.top .crumb{font-size:.85rem;color:var(--muted)}
.top .sp{flex:1}
.iconbtn{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
.iconbtn .dot{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;font-size:.65rem;font-weight:700;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.content{flex:1;overflow-y:auto;padding:26px 28px 60px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* Building blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:10px 16px;font-weight:600;font-size:.9rem;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:#fff}
.btn:hover{background:var(--moss);border-color:var(--moss)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);background:var(--card)}
.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn.bad{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:.8rem;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{all:unset;cursor:pointer;color:var(--moss);font-weight:600;font-size:.88rem}
.link:hover{text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:.75rem;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}
.p-info{background:var(--info-bg);color:var(--info)}
.p-neutral{background:#ebe8e2;color:var(--muted)}
:root[data-contrast="high"] .pill{border:1px solid currentColor;background:#fff}
.pill svg.lucide{width:13px;height:13px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:.8rem;background:var(--card)}
.chip svg.lucide{width:14px;height:14px;color:var(--moss)}
.av{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none}
.logo{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:1.25rem;color:#fff;flex:none}
.stat{display:flex;flex-direction:column;gap:4px}
.stat b{font-size:1.7rem;font-weight:600;line-height:1}
.hello{background:linear-gradient(110deg,#0c1109,#4e5f43);color:#f1eee8;border-radius:16px;padding:26px 28px;display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}
:root[data-contrast="high"] .hello{background:#000}
.hello h1{color:#fff}
.hello .btn{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.job{display:flex;gap:14px;align-items:flex-start;cursor:pointer;transition:border-color .15s}
.job:hover{border-color:var(--moss)}
.job .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.job .title{font-weight:600;font-size:1rem}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta svg.lucide{width:14px;height:14px}
.match{min-width:64px;text-align:center;border-radius:10px;padding:8px 6px;background:var(--paper);border:1px solid var(--line)}
.match b{display:block;font-size:1.15rem}
.match small{font-size:.68rem;color:var(--muted)}
.savebtn{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px}
.savebtn[aria-pressed="true"]{color:var(--moss)}
.savebtn[aria-pressed="true"] svg{fill:currentColor}
.layout-search{display:grid;grid-template-columns:270px 1fr;gap:20px;align-items:start}
.filters{position:sticky;top:0;display:flex;flex-direction:column;gap:16px}
.filters fieldset{border:none;padding:0;margin:0;display:flex;flex-direction:column;gap:7px}
.filters legend{font-weight:600;font-size:.85rem;margin-bottom:6px}
.check{display:flex;gap:9px;align-items:center;font-size:.88rem;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--moss)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.84rem;font-weight:600}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;width:100%}
.input:focus{border-color:var(--moss)}
textarea.input{min-height:96px;resize:vertical}
.searchbar{display:flex;gap:10px}
.searchbar .input{flex:1}
.fac-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.photo{aspect-ratio:4/3;border-radius:10px;display:grid;place-items:center;color:#fff;position:relative;overflow:hidden;background:repeating-linear-gradient(135deg,#4e5f43 0 14px,#55684a 14px 28px)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo svg.lucide{width:34px;height:34px;opacity:.9}
.photo .cap{position:absolute;left:8px;bottom:8px;right:8px;font-size:.72rem;background:rgba(12,17,9,.7);border-radius:6px;padding:3px 7px}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted)}
.step .n{width:26px;height:26px;border-radius:99px;display:grid;place-items:center;border:1px solid var(--line);font-weight:600;background:var(--card)}
.step.on{color:var(--ink);font-weight:600}
.step.on .n{background:var(--ink);color:#fff;border-color:var(--ink)}
.step.done .n{background:var(--ok);color:#fff;border-color:var(--ok)}
.step .bar{width:34px;height:2px;background:var(--line)}
.timeline{display:flex;gap:0;margin-top:6px}
.tl{flex:1;display:flex;flex-direction:column;gap:6px;font-size:.75rem;color:var(--muted);position:relative}
.tl .d{height:6px;border-radius:99px;background:var(--line)}
.tl.done .d{background:var(--moss)}
.tl.cur .d{background:var(--ink)}
.tl.fail .d{background:var(--bad)}
.tl.done,.tl.cur{color:var(--ink)}
.tl+.tl{margin-left:6px}
.table{width:100%;border-collapse:collapse;font-size:.88rem}
.table th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
.table td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:none}
.tablewrap{overflow-x:auto}
.chat{display:grid;grid-template-columns:280px 1fr;min-height:520px;padding:0;overflow:hidden}
.threads{border-right:1px solid var(--line);display:flex;flex-direction:column}
.thread{all:unset;cursor:pointer;display:flex;gap:10px;padding:14px;border-bottom:1px solid var(--line)}
.thread[aria-current="true"]{background:var(--paper)}
.thread .t{flex:1;min-width:0}
.thread .t p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.8rem;color:var(--muted)}
.conv{display:flex;flex-direction:column}
.conv .msgs{flex:1;padding:18px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;max-height:440px}
.bubble{max-width:72%;padding:10px 14px;border-radius:14px;font-size:.88rem;background:var(--paper);border:1px solid var(--line)}
.bubble.me{align-self:flex-end;background:var(--ink);color:#fff;border-color:var(--ink)}
.bubble small{display:block;opacity:.7;font-size:.7rem;margin-top:3px}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:none}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;background:#c9c5bd;border-radius:99px;transition:.2s}
.switch span::after{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:99px;transition:.2s}
.switch input:checked+span{background:var(--moss)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:3px solid #c9a227;outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:var(--card);padding:7px 13px;cursor:pointer;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.empty{text-align:center;padding:40px 20px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:.9rem;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:50}
.drop{position:absolute;right:28px;top:64px;width:340px;z-index:40;box-shadow:0 14px 40px rgba(0,0,0,.16);max-height:420px;overflow-y:auto;padding:6px}
.drop .n-item{padding:12px;border-bottom:1px solid var(--line);font-size:.86rem}
.drop .n-item:last-child{border:none}
.success{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 20px}
.success .big{width:64px;height:64px;border-radius:99px;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center}
.success .big svg.lucide{width:32px;height:32px}
.checklist{display:flex;flex-direction:column;gap:10px}
.note{border-left:3px solid var(--moss);background:var(--paper);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.86rem}
.req li{margin-bottom:4px}
.tag-skill{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:.78rem}

/* Login */
.login{min-height:100%;display:grid;grid-template-columns:1.05fr 1fr}
.login .art{background:linear-gradient(160deg,#0c1109,#4e5f43);color:#eeeae3;padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:30px;position:relative;overflow:hidden}
.login .art h1{font-size:3.2rem;color:#fff}
.login .art .shape{position:absolute;right:-60px;bottom:-60px;width:320px;height:320px;background:var(--cream);opacity:.16;border-radius:0 60% 0 60%}
.login .form{padding:48px;display:flex;flex-direction:column;justify-content:center;gap:20px;max-width:520px;margin:0 auto;width:100%}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.role{all:unset;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:.85rem}
.role b{font-size:.92rem}
.role[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.role:focus-visible{outline:3px solid #c9a227}

@media (max-width:980px){
  .layout-search{grid-template-columns:1fr}
  .filters{position:static}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:1fr 1fr}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{flex-direction:row;align-items:center;padding:10px 12px;gap:10px;overflow-x:auto}
  .side .who,.side .foot label{display:none}
  .nav{flex-direction:row}
  .nav button{padding:8px 10px;white-space:nowrap}
  .nav button span.lbl{display:none}
  .side .foot{margin:0;flex-direction:row}
  .top{padding:12px 16px}
  .content{padding:18px 16px 60px}
  .g2,.g3{grid-template-columns:1fr}
  .chat{grid-template-columns:1fr}
  .threads{border-right:none;border-bottom:1px solid var(--line)}
  .login{grid-template-columns:1fr}
  .login .art{padding:28px}
  .login .art h1{font-size:2.3rem}
  .login .form{padding:28px 18px}
  .fac-grid{grid-template-columns:1fr 1fr}
  .drop{right:12px;left:12px;width:auto}
}
@media (max-width:420px){.roles{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}}
</style>
</head>

function match(j, t){
  const sk = j.skills.filter(s => t.skills.includes(s)).length / j.skills.length;
  const nd = t.needs.length ? t.needs.filter(n => j.fac.includes(n) && facStatus(j.co, n) === "verified").length / t.needs.length : 1;
  const md = t.pref.includes(j.mode) ? 1 : 0.4;
  return Math.round(sk * 55 + nd * 30 + md * 15);
}

V.jobs = () => {
  const f = S.filters, t = talents[S.me];
  let list = jobs.filter(j => {
    const q = f.q.toLowerCase();
    if (q && !(j.title+" "+co(j.co).name+" "+j.skills.join(" ")).toLowerCase().includes(q)) return false;
    if (f.mode.length && !f.mode.includes(j.mode)) return false;
    if (f.fac.length && !f.fac.every(k => j.fac.includes(k))) return false;
    if (f.verified && !jobVerified(j)) return false;
    if (f.needsOnly && !t.needs.every(n => j.fac.includes(n) && facStatus(j.co,n)==="verified")) return false;
    return true;

function timeline(a){
  const failed = a.status === "Ditolak";
  const idx = failed ? STATUSES.indexOf(Object.keys(a.history).filter(k=>k!=="Ditolak").pop()) : STATUSES.indexOf(a.status);
  return `<div class="timeline" aria-label="Tahap lamaran">${STATUSES.map((s,i)=>{
    const cls = i<idx ? "done" : i===idx ? (failed?"done":"cur") : (failed&&i===idx+1?"fail":"");
    const label = failed&&i===idx+1 ? "Ditolak" : s;
    const date = a.history[label] || "";
    return `<div class="tl ${cls}"><div class="d"></div><span><b>${label}</b>${date?`<br>${date}`:""}</span></div>`;}).join("")}</div>`;
}

const TITLES = {};
function render(){
  const root = $("#root");
  document.documentElement.style.fontSize = {normal:"100%",large:"112.5%",xl:"125%"}[S.a11y.size];
  document.documentElement.dataset.contrast = S.a11y.contrast ? "high" : "";
  document.documentElement.dataset.reduceMotion = S.a11y.motion;
  document.body.classList.toggle("simple", S.a11y.simple);
  root.innerHTML = S.logged ? (V[S.view] || V.home)() : loginView();
  icons();
  const m = $("#msgs"); if (m) m.scrollTop = m.scrollHeight;
}
const simpleStyle = document.createElement("style");
simpleStyle.textContent = "body.simple .job .chip, body.simple .job .meta span:nth-child(3){display:none}";
document.head.appendChild(simpleStyle);

/* ================= EVENTS ================= */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-nav],[data-action],[data-save],[data-open-job],[data-thread],[data-size],[data-loginrole]");
  if (!el) { if (S.showNotif && !e.target.closest(".drop")) { S.showNotif=false; render(); } return; }
  if (el.dataset.save) { e.stopPropagation(); const id = el.dataset.save; S.saved.has(id) ? S.saved.delete(id) : S.saved.add(id); toast(S.saved.has(id)?"Lowongan disimpan":"Dihapus dari tersimpan"); render(); return; }
  if (el.dataset.nav) { go(el.dataset.nav); return; }
  if (el.dataset.openJob) { go("job",{id:el.dataset.openJob}); return; }
  if (el.dataset.thread) { S.thread = el.dataset.thread; render(); return; }
  if (el.dataset.size) { S.a11y.size = el.dataset.size; render(); toast("Ukuran teks diubah"); return; }
  if (el.dataset.loginrole) { S.loginRole = el.dataset.loginrole; render(); return; }
  const id = el.dataset.id;
  switch (el.dataset.action) {
    case "notif": S.showNotif = !S.showNotif; if (S.showNotif) unread[S.role] = 0; render(); break;
    case "logout": S.logged = false; S.loginRole = S.role; render(); break;
    case "register": toast("Pendaftaran: isi data diri, lalu kebutuhan aksesibilitas (demo)"); break;
    case "reset-filter": S.filters = {q:"",mode:[],fac:[],fit:[],verified:false,needsOnly:false}; render(); break;
    case "open-job": go("job",{id}); break;
    case "start-apply": S.apply = {step:1, cv:"profile", acc:[...talents[S.me].needs].filter(k=>job(id).fac.includes(k)), note:"", agree:false}; go("apply",{id}); break;
    case "apply-next": saveApplyFields(); S.apply.step++; render(); break;
    case "apply-prev": saveApplyFields(); S.apply.step--; render(); break;
    case "apply-submit": {
      const j = job(S.params.id), A = S.apply;
      const accTxt = [A.acc.map(k=>FAC[k].label).join(", "), A.note].filter(Boolean).join(". ");
      apps.push({id:"a"+Date.now(), job:j.id, tal:S.me, status:"Dikirim", date:"18 Nov 2026", history:{Dikirim:"18 Nov"}, acc:accTxt});
      if (!threads.find(t=>t.co===j.co && t.tal===S.me)) threads.push({id:"t"+Date.now(), co:j.co, tal:S.me, msgs:[{from:"co", text:`Terima kasih sudah melamar ${j.title}. Lamaranmu akan kami tinjau.`, time:now()}]});
      if (j.co === S.myCo) notify("company", `${talents[S.me].name} melamar ${j.title}.`);
      S.apply.step = 4; render(); toast("Lamaran berhasil dikirim"); break; }
    case "withdraw": apps = apps.filter(a=>a.id!==id); toast("Lamaran ditarik"); render(); break;
    case "msg-company": { let t = threads.find(t=>t.co===id && t.tal===S.me); if (!t) { t = {id:"t"+Date.now(), co:id, tal:S.me, msgs:[{from:"co",text:"Halo, ada yang bisa kami bantu soal lowongan ini?",time:now()}]}; threads.push(t);} S.thread = t.id; go("messages"); break; }
    case "msg-talent": { let t = threads.find(t=>t.co===S.myCo && t.tal===id); if (!t) { t = {id:"t"+Date.now(), co:S.myCo, tal:id, msgs:[]}; t.msgs.push({from:"co",text:"Halo, terima kasih sudah melamar. Kami ingin menanyakan beberapa hal.",time:now()}); threads.push(t);} S.thread = t.id; go("messages"); break; }
    case "edit-profile": toast("Mode ubah profil (demo)"); break;
    case "fake-cv": toast("Membuka CV kandidat (demo)"); break;
    case "open-cand": go("c-candidate",{id}); break;
    case "cand-filter": go("c-candidates",{job:id}); break;
    case "advance": {
      const a = apps.find(x=>x.id===id); const next = {Dikirim:"Ditinjau", Ditinjau:"Interview", Interview:"Diterima"}[a.status];
      if (next === "Interview") { const iv = $("#ivtime"); a.interview = iv ? iv.value : ""; }
      a.status = next; a.history[next] = "18 Nov";
      if (a.tal === S.me) notify("talent", `${co(job(a.job).co).name}: lamaran ${job(a.job).title} sekarang ${next}.`);
      toast(`Status ${talents[a.tal].name} jadi ${next}`); render(); break; }
    case "reject": { const a = apps.find(x=>x.id===id); a.status = "Ditolak"; a.history["Ditolak"] = "18 Nov";
      if (a.tal === S.me) notify("talent", `${co(job(a.job).co).name}: lamaran ${job(a.job).title} tidak dilanjutkan.`);
      toast("Kandidat ditolak"); render(); break; }
    case "open-verif": go("v-review",{id}); break;
    case "verif-ok": case "verif-no": {
      const v = verifQueue.find(x=>x.id===id), ok = el.dataset.action === "verif-ok";
      if (ok && document.querySelectorAll("[data-vcheck]:checked").length < 4) { toast("Centang semua checklist dulu sebelum menyetujui"); break; }
      v.status = ok ? "approved" : "rejected";
      co(v.co).facilities.forEach(f => { if (v.items.includes(f.key)) { f.status = ok ? "verified" : "rejected"; f.date = "18 Nov 2026"; } });
      if (v.co === S.myCo) notify("company", ok ? "Fasilitas kamu sudah terverifikasi." : "Pengajuan fasilitas ditolak, cek catatan tim.");
      toast(ok ? `${co(v.co).name} mendapat badge terverifikasi` : "Pengajuan ditolak"); go("v-queue"); break; }
  }
});
document.addEventListener("keydown", e => {
  const card = e.target.closest && e.target.closest("[data-open-job]");
  if (card && (e.key === "Enter" || e.key === " ") && e.target === card) { e.preventDefault(); go("job",{id:card.dataset.openJob}); }
  if (e.key === "Escape" && S.showNotif) { S.showNotif = false; render(); }
});
function saveApplyFields(){
  const l = $("#ap-letter"); if (l) S.apply.letter = l.value;
  const n = $("#ap-note"); if (n) S.apply.note = n.value;
}
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "roleSel") { S.role = t.value; S.view = {talent:"home",company:"c-home",verifier:"v-queue"}[t.value]; S.params = {}; S.thread = null; render(); return; }
  if (t.dataset.filter) { const arr = S.filters[t.dataset.filter]; t.checked ? arr.push(t.value) : arr.splice(arr.indexOf(t.value),1); render(); return; }
  if (t.dataset.toggle) { S.filters[t.dataset.toggle] = t.checked; render(); return; }
  if (t.hasAttribute("data-cv")) { saveApplyFields(); S.apply.cv = t.value; render(); return; }
  if (t.id === "cvfile" && t.files[0]) { S.apply.cvName = t.files[0].name; saveApplyFields(); render(); return; }
  if (t.hasAttribute("data-acc")) { const a = S.apply.acc; t.checked ? a.push(t.value) : a.splice(a.indexOf(t.value),1); return; }
  if (t.id === "agree") { S.apply.agree = t.checked; saveApplyFields(); render(); return; }
  if (t.hasAttribute("data-need")) { const n = talents[S.me].needs; t.checked ? n.push(t.value) : n.splice(n.indexOf(t.value),1); toast("Kebutuhan aksesibilitas disimpan"); return; }
  if (t.hasAttribute("data-pref")) { const p = talents[S.me].pref; t.checked ? p.push(t.value) : p.splice(p.indexOf(t.value),1); toast("Preferensi disimpan"); return; }
  if (t.hasAttribute("data-cvup") && t.files[0]) { talents[S.me].cv = t.files[0].name; toast("CV diperbarui"); render(); return; }
  if (t.dataset.a11y) { S.a11y[t.dataset.a11y] = t.checked; render(); toast("Pengaturan diterapkan"); return; }
  if (t.hasAttribute("data-candfilter")) { go("c-candidates",{job:t.value}); return; }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if (f === "search") { S.filters.q = $("#q").value; render(); }
  if (f === "login") { S.logged = true; S.role = S.loginRole; S.view = {talent:"home",company:"c-home",verifier:"v-queue"}[S.role]; render(); toast("Berhasil masuk"); }
  if (f === "msg") {
    const inp = $("#msgin"), text = inp.value.trim(); if (!text) return;
    const th = threads.find(t=>t.id===S.thread), side = S.role === "talent" ? "tal" : "co";
    th.msgs.push({from:side, text, time:now()}); render();
    setTimeout(() => {
      th.msgs.push(side === "tal" ? {from:"co", text:"Terima kasih, pesanmu sudah kami terima. HRD akan membalas di jam kerja.", time:now()} : {from:"tal", text:"Baik, terima kasih atas informasinya.", time:now()});
      if (S.view === "messages") render();
    }, 1200);
    setTimeout(() => { const i = $("#msgin"); if (i) i.focus(); }, 0);
  }
  if (f === "skill") { const v = $("#newskill").value.trim(); if (v) { talents[S.me].skills.push(v); toast("Skill ditambahkan"); render(); } }
  if (f === "newjob") {
    const title = $("#nj-title").value.trim(); if (!title) return;
    const fac = [...document.querySelectorAll('input[name="njfac"]:checked')].map(x=>x.value);
    jobs.unshift({id:"j"+Date.now(), title, co:S.myCo, mode:$("#nj-mode").value, loc:co(S.myCo).city, salary:$("#nj-sal").value||"Dirahasiakan", type:$("#nj-type").value, posted:"Baru saja",
      fac, skills:$("#nj-skills").value.split(",").map(s=>s.trim()).filter(Boolean).concat([]).slice(0,6).length?$("#nj-skills").value.split(",").map(s=>s.trim()).filter(Boolean):["Komunikasi"],
      fit:["Fisik","Netra","Tuli"], desc:$("#nj-desc").value||"Deskripsi akan segera diperbarui.", req:["Detail kualifikasi menyusul"]});
    toast("Lowongan diterbitkan dan tampil di pencarian talenta"); go("c-jobs");
  }
  if (f === "addfac") {
    const key = $("#af-key").value, file = $("#af-photo").files[0], note = $("#af-note").value;
    const push = img => {
      co(S.myCo).facilities.push({key, status:"pending", date:"-", img});
      verifQueue.push({id:"v"+Date.now(), co:S.myCo, items:[key], submitted:"18 Nov 2026", photos:file?1:0, status:"pending", note:note||"Pengajuan fasilitas baru."});
      notify("verifier", `${co(S.myCo).name} mengajukan ${FAC[key].label}.`);
      toast("Terkirim ke tim verifikasi"); render();
    };
    if (file) { const r = new FileReader(); r.onload = () => push(r.result); r.readAsDataURL(file); } else push(null);
  }
});
render();
</script>
</body>
</html>
